<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}auto-store{% endblock %} · 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  :root { --pico-font-size: 92%; }
  body { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; margin: 0; }
  aside { background: #1F2933; color: #CBD2D9; padding: 1rem; }
  aside a { color: #CBD2D9; display: block; padding: .45rem .6rem; border-radius: 6px; text-decoration: none; }
  aside a.on { background: #2B6CB0; color: #fff; font-weight: 600; }
  aside .brand { color: #fff; font-weight: 700; margin-bottom: .8rem; }
  aside .who { font-size: .78rem; color: #9AA5B1; margin-top: 1rem; line-height: 1.4; }
  main { padding: 1.2rem 1.6rem; max-width: 1400px; overflow-x: auto; }
  table { min-width: 860px; }        /* 좁은 창에서 글자가 세로로 흐르지 않게: 표는 가로 스크롤 */
  .flash { background: #FFFBE6; border: 1px solid #E0C76A; padding: .5rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
  table { font-size: .85rem; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
  .kpi article { margin: 0; padding: .7rem .9rem; }
  .kpi .v { font-size: 1.5rem; font-weight: 700; }
  .kpi .l { font-size: .75rem; color: #666; }
  .tag { display: inline-block; font-size: .72rem; padding: .1rem .45rem; border-radius: 10px; background: #EEF0F4; margin-right: .2rem; }
  .tag.ok { background: #D9F2E3; } .tag.warn { background: #FFE4C4; } .tag.bad { background: #FDECEC; }
  pre.card { background: #F7F8FA; padding: .8rem; font-size: .8rem; white-space: pre-wrap; }
  form.inline { display: inline; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; }
  .row-actions button { padding: .2rem .6rem; font-size: .78rem; margin: 0; }
  h2 { font-size: 1.3rem; margin-bottom: .8rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
</style>
</head>
<body>
<aside>
  <div class="brand">auto-store 관리자 <span class="tag">{{ env }}</span></div>
  {% for href, label in menu %}<a href="{{ href }}" class="{{ 'on' if (path == href or (href != '/' and path.startswith(href))) else '' }}">{{ label }}</a>{% endfor %}
  <div class="who">{{ email or '로그인 안 됨' }}{% if role %} · {{ role }}{% endif %}<br><a href="/logout">로그아웃</a></div>
</aside>
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
